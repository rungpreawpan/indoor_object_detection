name: indoor_object_detection
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  flutter_localization: ^0.2.2
  flutter_svg: ^2.0.16
  sensors_plus: ^6.1.1
  flutter_tts: ^4.2.2
  image_picker: ^1.1.2
  image: ^4.5.3
  camera: ^0.11.1
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.3
  dio: ^5.8.0+1
  android_id: ^0.4.0
  device_info_plus: ^11.2.1
  flutter_keyboard_visibility: ^6.0.0
  intl: ^0.19.0
  translator: ^1.0.3+1
  photo_manager: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/intro/
    - assets/logo/